<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Moral Entregas</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f1f5f9;color:#172033}
header{background:#087443;color:white;padding:24px 18px;border-radius:0 0 22px 22px}
header h1{margin:0 0 8px;font-size:27px}
main{max-width:600px;margin:auto;padding:18px}
.card{background:white;padding:18px;border-radius:16px;margin-bottom:16px}
h2{font-size:19px}
label{display:block;font-weight:bold;margin:12px 0 6px}
input,button{width:100%;padding:13px;border:1px solid #cbd5e1;border-radius:9px;font-size:16px}
button{border:0;background:#087443;color:white;font-weight:bold;margin-top:14px}
.item{border-top:1px solid #ddd;padding:13px 0;overflow-wrap:anywhere}
small{color:#64748b}
</style>
</head>
<body>
<header>
<h1>🚚 Moral Entregas</h1>
<p>Sua entrega, acompanhada com facilidade.</p>
</header>
<main>
<section class="card">
<h2>📦 Cadastrar entrega</h2>
<form id="form">
<label>Nome do cliente</label>
<input id="cliente" required>
<label>Local de retirada</label>
<input id="origem" required>
<label>Endereço de entrega</label>
<input id="destino" required>
<label>Telefone</label>
<input id="telefone" type="tel">
<label>Valor da entrega (R$)</label>
<input id="valor" type="number" min="0" step="0.01" required>
<button type="submit">Cadastrar entrega</button>
</form>
<p id="mensagem"></p>
</section>
<section class="card">
<h2>🔎 Consultar entrega</h2>
<label>Código da entrega</label>
<input id="busca" placeholder="Ex.: MORAL-123456">
<button type="button" id="consultar">Consultar</button>
<div id="resultado"></div>
</section>
<section class="card">
<h2>📋 Entregas cadastradas</h2>
<div id="lista">Carregando entregas...</div>
</section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = "https://ucfjjkteifjgutrwfauh.supabase.co";
const SUPABASE_KEY ="sb_publishable_uM8j4LVrQdMBAurChpMZUA_yRyoy68a";
const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const campo = id => document.getElementById(id);
const escapar = s => String(s ?? "").replace(/[&<>"']/g, c =>
({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));


async function carregar() {
  campo("lista").textContent =
    "Lista completa disponível somente no painel administrativo.";
}
  

campo("form").addEventListener("submit",async ev=>{
  ev.preventDefault();
  campo("mensagem").textContent = "Salvando...";
  const codigo = "MORAL-" + Math.floor(100000 + Math.random()*900000);
  const entrega = {
    codigo,
    cliente:campo("cliente").value.trim(),
    origem:campo("origem").value.trim(),
    destino:campo("destino").value.trim(),
    telefone:campo("telefone").value.trim(),
    valor:Number(campo("valor").value),
    status:"Recebida"
  };
  const {error} = await db.from("entregas").insert(entrega);
  if(error){
    campo("mensagem").textContent = "Não foi possível salvar: " + error.message;
    return;
  }
  campo("mensagem").textContent = "Entrega cadastrada! Código: " + codigo;
  campo("form").reset();
  await carregar();
});

campo("consultar").addEventListener("click",async()=>{
  const codigo = campo("busca").value.trim().toUpperCase();
  const {data,error} = await db.rpc("consultar_entrega", {
  p_codigo: codigo
});
  if(error){
    campo("resultado").textContent = "Erro: " + error.message;
    return;
  }
  campo("resultado").innerHTML = data
    ? `<div class="item"><b>${escapar(data.codigo)}</b><br>
       Cliente: ${escapar(data.cliente)}<br>
       Status: ${escapar(data.status)}<br>
       Destino: ${escapar(data.destino)}</div>`
    : "Entrega não encontrada.";
});

carregar();
</script>
</body>
</html>
